</style></head><body>

 cit:[['New York City',-74,40.7],['Miami',-80.2,25.8],['Houston',-95.4,29.8],['New Orleans',-90,30],['Mexico City',-99,19.4],['Havana',-82.4,23.1],['Boston',-71,42.4],['Rio de Janeiro',-43.2,-22.9],['Buenos Aires',-58.4,-34.6],['Lima',-77,-12],['London',-0.1,51.5],['Paris',2.3,48.9],['Lisbon',-9.1,38.7],['Rome',12.5,41.9],['Athens',23.7,38],['Istanbul',29,41],['Cairo',31.2,30],['Lagos',3.4,6.5],['Cape Town',18.4,-33.9],['Dakar',-17.4,14.7]]}};
let M,mode='idle',draft=null,sel=3,storms=[],cool=0,total=0,logs=[],fx=[],warnSet=new Set();
const X=lo=>(lo-M.lon0)*M.sx,Y=la=>(M.lat0-la)*M.sx,LO=x=>M.lon0+x/M.sx,LA=y=>M.lat0-y/M.sx;
function setMap(k){
 M=MAPS[k];M.sx=400/(M.lon1-M.lon0);M.h=Math.round((M.lat0-M.lat1)*M.sx);
 c.height=M.h;c.style.aspectRatio='400/'+M.h;
 M.C=M.cit.map(a=>({n:a[0],x:X(a[1]),y:Y(a[2])}));
 storms=[];draft=null;mode='idle';fx=[];
 $('m1').className=k==='asia'?'pri':'';$('m2').className=k==='atl'?'pri':'';ui();
}
$('m1').onclick=()=>setMap('asia');$('m2').onclick=()=>setMap('atl');
function info(x,y){
 const lo=LO(x),la=LA(y);let t;
 if(M.k==='asia')t=(la>=0&&lo>=100)?'Typhoon':'Cyclone';
 else if(lo>-6&&lo<37&&la>30&&la<46)t='Medicane';
 else if(la<0)t='Cyclone';else if(lo<-15)t='Hurricane';else t='Storm';
 return{type:t,dir:la<0?1:-1};
}
function nmOf(s){return(s.et?'Extratropical':info(s.x,s.y).type)+' '+s.nm}
const fmt=m=>m>=1000?'$'+(m/1000).toFixed(1)+'B':'$'+m+'M';
function poly(a){g.beginPath();for(let i=0;i<a.length;i+=2)i?g.lineTo(X(a[i]),Y(a[i+1])):g.moveTo(X(a[i]),Y(a[i+1]));g.closePath()}
function mkChips(){
 const el=$('chips');el.innerHTML='';
 CATS.forEach((n,i)=>{const b=document.createElement('button');b.className='chip'+(i===sel?' on':'');b.textContent=n;b.style.background=COL[i];b.style.color='#111';b.onclick=()=>{sel=i;mkChips()};el.appendChild(b)});
}
function ui(){
 const ed=mode==='edit',n=draft?draft.pts.length:0;
 $('chips').hidden=!ed||draft.done;$('nm').hidden=!ed;
 $('endb').hidden=!ed||n<1||draft.done;$('undo').hidden=!ed||n<1;
 $('go').hidden=!(ed&&draft.done);$('cancel').hidden=!ed;$('mk').hidden=ed;
 $('m1').disabled=$('m2').disabled=ed;
 $('endb').textContent=ed&&draft.endNext?'Batal End point':'End point';
 let h='';
 if(ed){
  if(draft.done)h='Jalur siap. Tekan Start badai untuk melihatnya bergerak.';
  else if(n===0)h='Beri nama badai, pilih kategori, lalu tap peta untuk Start point.';
  else if(draft.endNext)h='Pilih kategori, lalu tap peta untuk End point.';
  else h='Pilih kategori, lalu tap peta untuk menambah titik. Tekan End point kalau titik berikutnya adalah akhir.';
  $('hint').textContent=h;
 }
}
$('mk').onclick=()=>{if(performance.now()<cool)return;mode='edit';draft={pts:[],endNext:false,done:false};$('nm').value=NAMES[Math.floor(Math.random()*NAMES.length)];mkChips();ui()};
$('cancel').onclick=()=>{mode='idle';draft=null;ui()};
$('undo').onclick=()=>{draft.pts.pop();draft.done=false;draft.endNext=false;ui()};
$('endb').onclick=()=>{draft.endNext=!draft.endNext;ui()};

 const pts=draft.pts.map(p=>({...p}));const L=[0];
 for(let i=1;i<pts.length;i++)L.push(L[i-1]+Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y));
 const nm=($('nm').value.trim()||NAMES[0]);
 storms.push({pts,L,d:0,i:1,ang:0,fade:1,nm,hit:{},x:pts[0].x,y:pts[0].y,c:pts[0].c,et:pts[0].et});
 cool=performance.now()+3000+Math.random()*2000;mode='idle';draft=null;ui();
};

 draft.pts.push({x:(e.clientX-r.left)*400/r.width,y:(e.clientY-r.top)*M.h/r.height,c:et?2:sel,et,ci:sel});
 if(draft.endNext&&draft.pts.length>1)draft.done=true;

});
function step(s,dt){
 const T=s.L[s.L.length-1];
 if(s.d>=T)s.fade-=dt/2;
 else{
  s.d=Math.min(T,s.d+26*dt);
  let i=1;while(i<s.L.length-1&&s.L[i]<s.d)i++;s.i=i;
  const a=s.pts[i-1],b=s.pts[i],t=(s.d-s.L[i-1])/((s.L[i]-s.L[i-1])||1);
  s.x=a.x+(b.x-a.x)*t;s.y=a.y+(b.y-a.y)*t;s.c=a.c+(b.c-a.c)*t;s.et=t<.5?a.et:b.et;
 }
 s.ang+=info(s.x,s.y).dir*(1.6+s.c*.35)*dt;
 M.C.forEach(ct=>{if(!s.hit[ct.n]&&Math.hypot(s.x-ct.x,s.y-ct.y)<14)hit(s,ct)});
}
function hit(s,ct){
 s.hit[ct.n]=1;const r=DM[s.et?7:Math.round(s.c)];
 const v=Math.round(r[0]+Math.random()*(r[1]-r[0]));total+=v;
 fx.push({x:ct.x,y:ct.y,t:0,txt:'-'+fmt(v)});
 logs.unshift(nmOf(s)+' menghantam '+ct.n+': kerugian '+fmt(v));logs=logs.slice(0,3);
 $('tot').textContent='Total kerugian: '+fmt(total);$('log').textContent=logs.join('\n');
}
function warns(s){
 const out=[];if(s.fade<1||s.d>=s.L[s.L.length-1])return out;
 const P=[{x:s.x,y:s.y}].concat(s.pts.slice(s.i));
 M.C.forEach(ct=>{
  if(s.hit[ct.n])return;let cum=0;
  for(let k=0;k<P.length-1;k++){
   const a=P[k],b=P[k+1],dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy)||1;
   const t=Math.max(0,Math.min(1,((ct.x-a.x)*dx+(ct.y-a.y)*dy)/(len*len)));
   if(Math.hypot(a.x+dx*t-ct.x,a.y+dy*t-ct.y)<14){if(cum+t*len<110)out.push(ct.n);break}
   cum+=len;
  }
 });
 return out;
}

}

 g.save();g.globalAlpha=Math.max(0,s.fade);
 g.fillStyle=COL[ci]+'55';g.beginPath();g.arc(s.x,s.y,R,0,7);g.fill();
 g.strokeStyle=COL[ci];g.lineWidth=3;g.lineCap='round';
 const arms=s.et?4:3;
 for(let k=0;k<arms;k++){g.beginPath();for(let r=2;r<=R;r+=1){const a=s.ang+k*6.283/arms+f.dir*r*(s.et?.1:.16);const px=s.x+Math.cos(a)*r,py=s.y+Math.sin(a)*r;r===2?g.moveTo(px,py):g.lineTo(px,py)}g.stroke()}
 if(ci>=4&&ci<7){g.fillStyle='#0b2a45';g.beginPath();g.arc(s.x,s.y,2.2,0,7);g.fill()}

 const t=nmOf(s)+' · '+(s.et?'ET':CATS[ci])+' '+(f.dir>0?'↻':'↺');
 g.strokeText(t,s.x,s.y-R-4);g.fillStyle='#fff';g.fillText(t,s.x,s.y-R-4);
 g.restore();
}
function draw(now){
 g.fillStyle='#1c4f7a';g.fillRect(0,0,400,M.h);

 for(let lo=Math.ceil(M.lon0/20)*20;lo<=M.lon1;lo+=20){g.beginPath();g.moveTo(X(lo),0);g.lineTo(X(lo),M.h);g.stroke()}

 g.fillStyle='#6d9b62';g.strokeStyle='#a9cf91';
 M.land.forEach(a=>{poly(a);g.fill();g.stroke()});
 if(M.k==='atl'){g.fillStyle='#1c4f7a';g.beginPath();g.ellipse(X(34.5),Y(43.2),6.5*M.sx,2.2*M.sx,0,0,7);g.fill()}

 M.lab.forEach(l=>g.fillText(l[0],X(l[1]),Y(l[2])));
 g.textAlign='left';g.fillText('Ekuator (arah putar berganti)',6,Y(0)-4);
 storms.forEach(s=>trail(s.pts,.35));
 g.font='8px system-ui,sans-serif';g.textAlign='left';
 M.C.forEach(ct=>{
  if(warnSet.has(ct.n)){g.strokeStyle='#ff3030';g.lineWidth=2;g.globalAlpha=.5+.5*Math.sin(now/150);g.beginPath();g.arc(ct.x,ct.y,9,0,7);g.stroke();g.globalAlpha=1}
  g.fillStyle='#fff';g.fillRect(ct.x-2,ct.y-2,4,4);
  g.lineWidth=2.5;g.strokeStyle='#0b2a45';g.strokeText(ct.n,ct.x+5,ct.y+3);g.fillText(ct.n,ct.x+5,ct.y+3);
 });
 if(draft&&draft.pts.length){

   g.fillStyle=COL[p.et?7:p.c];g.beginPath();g.arc(p.x,p.y,7,0,7);g.fill();g.strokeStyle='#0b2a45';g.lineWidth=2;g.stroke();
   const last=i===draft.pts.length-1&&draft.done;
   g.fillStyle='#111';g.font='bold 9px system-ui,sans-serif';g.textAlign='center';g.fillText(i===0?'S':last?'E':String(i),p.x,p.y+3);
  });
 }
 storms.forEach(drawStorm);
 g.font='bold 12px system-ui,sans-serif';g.textAlign='center';
 fx.forEach(f=>{g.globalAlpha=Math.max(0,1-f.t/3);g.fillStyle='#ff4d4d';g.strokeStyle='#fff';g.lineWidth=3;g.strokeText(f.txt,f.x,f.y-12-f.t*10);g.fillText(f.txt,f.x,f.y-12-f.t*10);g.globalAlpha=1});
}
let spd=1;
[[0.1,'Real time (0.1x)'],[0.5,'0.5x'],[1,'1x normal'],[2,'2x'],[2.5,'2.5x'],[3,'3x']].forEach(a=>{
 const b=document.createElement('button');b.textContent=a[1];b.dataset.v=a[0];
 b.onclick=()=>{spd=a[0];document.querySelectorAll('#spd button').forEach(x=>x.className=(+x.dataset.v===spd)?'pri':'')};
 if(a[0]===1)b.className='pri';$('spd').appendChild(b);
});
let last=performance.now(),wt='';
function loop(t){
 const dt=Math.min(.05,(t-last)/1000)*spd;last=t;
 storms.forEach(s=>step(s,dt));storms=storms.filter(s=>s.fade>0);
 fx.forEach(f=>f.t+=dt);fx=fx.filter(f=>f.t<3);
 const W=[];warnSet=new Set();
 storms.forEach(s=>warns(s).forEach(n=>{warnSet.add(n);W.push('WARNING FOR '+n.toUpperCase()+' BECAUSE '+nmOf(s).toUpperCase()+' IS DIRECTING TO THE CITY')}));
 const w=W.join('\n');if(w!==wt){wt=w;$('warn').textContent=w;$('warn').hidden=!w}
 const left=cool-t;
 if(mode==='idle'){$('mk').disabled=left>0;$('mk').textContent=left>0?'Tunggu '+Math.ceil(left/1000)+' detik':'Make a storm';
  $('hint').textContent=storms.length?storms.length+' badai aktif. Tekan Make a storm untuk badai lain.':'Pilih peta, lalu tekan Make a storm untuk membuat badai baru.'}
 draw(t);requestAnimationFrame(loop);
}
setMap('asia');requestAnimationFrame(loop);
</script></body></html>
